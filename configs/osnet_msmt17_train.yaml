model:
  name: 'osnet_x0_25'
  pretrained: True
data:
  type: 'image'
  sources: ['msmt17']
  targets: ['msmt17']
  height: 256
  width: 128
  combineall: False
  transforms: ['random_flip', 'random_erase']
  save_dir: 'logs/osnet_msmt17_supervised'
loss:
  name: 'triplet'
  softmax:
    label_smooth: True
  triplet:
    margin: 0.3
    weight_t: 1.0
    weight_x: 1.0
train:
  optim: 'adam'
  lr: 0.0003
  max_epoch: 60
  batch_size: 32
  fixbase_epoch: 5
  open_layers: ['classifier']
  lr_scheduler: 'single_step'
  stepsize: [40]
test:
  batch_size: 256
  dist_metric: 'euclidean'
  normalize_feature: True
  evaluate: False
  eval_freq: 10
